name: Actualizar Lista M3U y Guia EPG

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 04:00 UTC (01:00 AM Argentina)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Procesador M3U y Generador EPG
        run: |
          python m3u_processor.py --output output/playlist.m3u --workers 35 --timeout 5.0

      - name: Confirmar y Subir Cambios al Repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ playlist.m3u || true
          
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en la lista o EPG."
          else
            git commit -m "Auto: Actualización de lista M3U y guía EPG [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi

      - name: Publicar / Actualizar Release Automático
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ArgTV Playlist & EPG (Última Actualización)"
          body: "Archivos de lista M3U y guía EPG XMLTV actualizados automáticamente."
          draft: false
          prerelease: false
          files: |
            output/playlist.m3u
            output/epg.xml.gz
            output/epg.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
